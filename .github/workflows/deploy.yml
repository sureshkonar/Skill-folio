name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Debug commit and config files
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          ls -la next.config.* || true

      - name: Remove conflicting Next config
        run: |
          # If an older branch/commit introduces next.config.js, prefer next.config.mjs.
          if [ -f "next.config.js" ] && [ -f "next.config.mjs" ]; then
            rm next.config.js
          fi

      - name: Install dependencies
        run: npm install

      - name: Build with Next.js
        run: npm run build

      - name: Verify static export output
        run: |
          if [ ! -d "out" ]; then
            echo "Expected static export directory 'out' was not found."
            echo "Repository root:"
            ls -la
            echo "Next build output (.next):"
            ls -la .next || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
